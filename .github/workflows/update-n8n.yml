name: update-n8n

on:
  schedule:
    # Каждую ночь: проверяем, вышла ли новая версия n8n в npm.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare versions
        id: cmp
        run: |
          latest=$(curl -fsSL https://registry.npmjs.org/n8n/latest | jq -r .version)
          current=$(grep -oP 'ARG N8N_VERSION=\K.*' Dockerfile)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "current n8n: $current, latest: $latest"
          if [ "$latest" = "$current" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            # Автоматически переносим только minor/patch: мажор меняет
            # поведение и миграции, его поднимаем вручную.
            if [ "${latest%%.*}" = "${current%%.*}" ]; then
              echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            else
              echo "up_to_date=true" >> "$GITHUB_OUTPUT"
              echo "::notice::n8n $latest is a major bump, skipping automatic update"
            fi
          fi

      - name: Bump Dockerfile, changelog and tag
        if: steps.cmp.outputs.up_to_date == 'false'
        env:
          LATEST: ${{ steps.cmp.outputs.latest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i "s/^ARG N8N_VERSION=.*/ARG N8N_VERSION=${LATEST}/" Dockerfile

          # WHY: схема версий как у форков — версия апстрима плюс наш минор и
          # патч. Обновление n8n всегда начинает новую ветку правок: c1.0.
          version="${LATEST}-c1.0"

          python3 - "$version" "$LATEST" <<'PY'
          import datetime, pathlib, sys
          version, n8n = sys.argv[1], sys.argv[2]
          p = pathlib.Path("CHANGELOG.md")
          text = p.read_text()
          section = (
              f"## [{version}] - {datetime.date.today().isoformat()}\n\n"
              f"### Changed\n- n8n updated to {n8n}.\n\n"
          )
          text = text.replace("## [Unreleased]\n\n", "## [Unreleased]\n\n" + section, 1)
          p.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile CHANGELOG.md
          git commit -m "chore: bump n8n to ${LATEST}"
          git tag -a "v${version}" -m "v${version}"
          git push origin HEAD:main
          # Тег пушим отдельной командой: иначе событие push тега теряется.
          git push origin "v${version}"

          # Пуш тега ботом через GITHUB_TOKEN не запускает workflow (защита
          # GitHub от рекурсии), поэтому сборку релиза запускаем явно.
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -d "{\"ref\":\"v${version}\"}"
